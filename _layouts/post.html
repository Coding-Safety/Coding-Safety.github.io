<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }} - 위험성평가</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Malgun Gothic", sans-serif; max-width: 720px; margin: 0 auto; padding: 20px; line-height: 1.6; color: #212529; }
    .back-btn { display: inline-block; margin-bottom: 16px; color: #1e3a8a; text-decoration: none; font-weight: bold; }
    .header-box { background: #f1f5f9; padding: 16px; border-radius: 8px; margin-bottom: 20px; border-left: 4px solid #1e3a8a; }
    h1 { margin: 0 0 8px 0; font-size: 1.4rem; }
    .meta { font-size: 0.9rem; color: #475569; }
    .img-box { margin: 20px 0; text-align: center; }
    .img-box img, .content img { max-width: 100%; height: auto; border: 1px solid #cbd5e1; border-radius: 8px; }
    .img-guide { font-size: 0.8rem; color: #64748b; margin-top: 6px; }
    table { width: 100%; border-collapse: collapse; margin: 16px 0; font-size: 0.95rem; }
    th, td { border: 1px solid #cbd5e1; padding: 10px; text-align: left; }
    th { background: #e2e8f0; }
  </style>
</head>
<body>
  <a href="{{ '/' | relative_url }}" class="back-btn">← 전체 업체 목록으로</a>
  <div class="header-box">
    <h1>{{ page.title }}</h1>
    <div class="meta">공종: {{ page.work_type }} | 작성일: {{ page.date | date: "%Y-%m-%d" }}</div>
  </div>

  {% if page.assessment_image %}
  <div class="img-box">
    <a href="{{ page.assessment_image | relative_url }}" target="_blank">
      <img src="{{ page.assessment_image | relative_url }}" alt="{{ page.title }} 위험성평가표">
    </a>
    <div class="img-guide">* 이미지를 터치하면 원본 크기로 크게 볼 수 있습니다.</div>
  </div>
  {% endif %}

  <div class="content">
    {{ content }}
  </div>
</body>
</html>
