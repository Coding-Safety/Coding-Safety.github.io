media:
  input: assets/images
  output: /assets/images

content:
  - name: companies
    label: "1. 협력업체 관리 (업체 등록)"
    type: collection
    path: _companies
    format: yaml-frontmatter
    filename: "{year}-{month}-{day}-{hour}{minute}{second}.md"
    view:
      fields: [ name, work_type, manager ]
    fields:
      - name: name
        label: "업체명 (예 - (주)한국건설)"
        type: string
        required: true
      - name: work_type
        label: "주력 공종"
        type: string
      - name: manager
        label: "현장 담당자 및 연락처"
        type: string

  - name: posts
    label: "2. 업체별 위험성평가"
    type: collection
    path: _posts
    filename: "{year}-{month}-{day}-{hour}{minute}{second}.md"
    view:
      fields: [ company, title, date ]
    fields:
      - name: layout
        label: "레이아웃"
        type: string
        default: post
        hidden: true
      - name: company
        label: "업체 선택"
        type: reference
        options:
          collection: companies
          value: "{fields.name}"
          label: "{fields.name}"
        required: true
      - name: title
        label: "작업명 / 평가 제목"
        type: string
        required: true
      - name: work_type
        label: "세부 공종"
        type: string
        required: true
      - name: date
        label: "등록일"
        type: date
        required: true
      - name: assessment_images
        label: "위험성평가표 이미지 (여러 장 동시 첨부 가능)"
        type: image
        list: true
      - name: body
        label: "추가 설명 및 위험요인 텍스트 (선택)"
        type: rich-text
